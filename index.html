<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stickman Cinematic — Western Scene</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand"><span class="brand-dot"></span> STICKMAN <b>CINEMATIC</b></div>
      <div class="scene-label">SCENE 01 <span>·</span> THE LITTLE OUTLAW</div>
    </div>

    <section class="stage" aria-label="Animasi stickman cinematic">
      <div class="camera" id="camera">
        <div class="sky"></div>
        <div class="sun-glow"></div>
        <div class="sun-rays"></div>
        <div class="haze haze-back"></div>
        <div class="haze haze-front"></div>
        <div class="cloud cloud-a"></div>
        <div class="cloud cloud-b"></div>
        <div class="distant-mesa mesa-a"></div>
        <div class="distant-mesa mesa-b"></div>
        <div class="windmill">
          <div class="mill-top"></div><div class="mill-blades"><i></i><i></i><i></i><i></i></div>
          <div class="mill-leg"></div>
        </div>
        <div class="cactus cactus-a"><i></i><b></b></div>
        <div class="cactus cactus-b"><i></i><b></b></div>
        <div class="ground"></div>
        <div class="road"></div>
        <div class="fence fence-left"><i></i><i></i><i></i><b></b></div>
        <div class="saloon">
          <div class="roof"></div>
          <div class="sign">SALOON</div>
          <div class="balcony"><i></i><i></i><i></i><i></i></div>
          <div class="saloon-door"></div>
          <div class="window"></div>
          <div class="porch-post"></div>
        </div>
        <div class="barrel barrel-a"></div><div class="barrel barrel-b"></div>
        <div class="dust dust-a"></div><div class="dust dust-b"></div>

        <div class="hero-shadow"></div>
        <svg class="hero" id="hero" viewBox="0 0 360 620" role="img" aria-label="Stickman koboi">
          <defs>
            <linearGradient id="headShade" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#fffdfb"/><stop offset=".65" stop-color="#e8e0e4"/><stop offset="1" stop-color="#bcb1bd"/>
            </linearGradient>
            <linearGradient id="shirtShade" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#ff4054"/><stop offset="1" stop-color="#a90d2a"/>
            </linearGradient>
            <linearGradient id="hatShade" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#53352e"/><stop offset="1" stop-color="#211817"/>
            </linearGradient>
            <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="5"/>
            </filter>
          </defs>
          <!-- legs -->
          <g class="legs" stroke="#211a1b" stroke-width="15" stroke-linecap="round" fill="none">
            <path class="back-leg" d="M163 438 Q128 520 72 590"/>
            <path class="front-leg" d="M213 437 Q256 493 260 574"/>
          </g>
          <g fill="#211a1b">
            <ellipse cx="55" cy="597" rx="34" ry="13" transform="rotate(-8 55 597)"/>
            <ellipse cx="271" cy="580" rx="36" ry="14" transform="rotate(-8 271 580)"/>
          </g>
          <!-- arms behind body -->
          <g class="arms" stroke="#211a1b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path class="left-arm" d="M133 274 Q78 291 63 344"/>
            <path class="point-arm" d="M235 274 Q277 280 295 236"/>
          </g>
          <!-- torso -->
          <path d="M128 244 Q178 222 229 245 L248 414 Q190 442 127 414 Z" fill="url(#shirtShade)" stroke="#201719" stroke-width="7" stroke-linejoin="round"/>
          <path d="M143 263 L147 286 M166 257 L170 282 M190 258 L194 282 M214 264 L218 287" stroke="#ffe6d8" stroke-width="5" stroke-linecap="round"/>
          <path d="M125 400 Q186 420 248 400 L248 423 Q185 446 126 423Z" fill="#392526" stroke="#171314" stroke-width="5"/>
          <rect x="178" y="397" width="39" height="31" rx="5" fill="#8b817b" stroke="#201719" stroke-width="5"/>
          <rect x="188" y="403" width="18" height="19" rx="2" fill="#302b2b"/>
          <!-- bandolier -->
          <path d="M130 388 Q165 360 205 385" stroke="#211a1b" stroke-width="15" fill="none"/>
          <g fill="#d89a26" stroke="#2b1d17" stroke-width="3">
            <rect x="133" y="368" width="13" height="35" rx="4"/><rect x="150" y="363" width="13" height="38" rx="4"/>
            <rect x="167" y="363" width="13" height="38" rx="4"/><rect x="184" y="368" width="13" height="35" rx="4"/>
          </g>
          <!-- gloves -->
          <path d="M48 338 Q30 326 28 346 Q12 363 33 376 Q52 386 69 366 L75 350Z" fill="#38221d" stroke="#171314" stroke-width="6"/>
          <g class="point-hand" fill="#38221d" stroke="#171314" stroke-width="6" stroke-linejoin="round">
            <path d="M285 235 Q273 213 284 198 Q298 186 307 202 L310 216 L339 202 Q352 196 357 207 Q360 220 345 227 L312 246 Q297 253 285 235Z"/>
            <path d="M292 224 Q277 215 272 202 Q266 188 278 182 Q291 179 299 199"/>
          </g>
          <!-- neck + head -->
          <path d="M164 221 L164 254 Q183 270 205 251 L203 215Z" fill="#d8cbd1" stroke="#211a1b" stroke-width="6"/>
          <ellipse cx="183" cy="158" rx="103" ry="105" fill="url(#headShade)" stroke="#211a1b" stroke-width="7"/>
          <!-- face expression -->
          <g class="brows" stroke="#211a1b" stroke-width="10" stroke-linecap="round">
            <path d="M116 132 L157 141"/><path d="M197 137 L236 119"/>
          </g>
          <g class="eyes">
            <ellipse cx="139" cy="164" rx="17" ry="11" fill="#fff"/>
            <ellipse cx="218" cy="160" rx="17" ry="11" fill="#fff"/>
            <ellipse class="pupil" cx="144" cy="167" rx="7" ry="9" fill="#211a1b"/>
            <ellipse class="pupil" cx="222" cy="163" rx="7" ry="9" fill="#211a1b"/>
            <path class="blink" d="M120 164 Q139 151 157 164 M199 160 Q218 147 237 160" fill="none" stroke="#211a1b" stroke-width="7" stroke-linecap="round"/>
          </g>
          <path d="M178 168 Q174 188 189 188" fill="none" stroke="#9b7e80" stroke-width="5" stroke-linecap="round"/>
          <g class="mouth">
            <path d="M139 205 Q183 237 227 198 Q221 249 181 251 Q148 244 139 205Z" fill="#681b2a" stroke="#211a1b" stroke-width="6"/>
            <path d="M151 216 Q183 232 216 211" fill="none" stroke="#f08c9a" stroke-width="5" stroke-linecap="round"/>
            <path d="M164 239 Q182 231 201 239 Q187 255 174 249Z" fill="#ed6372"/>
          </g>
          <!-- hat -->
          <path d="M77 98 Q103 30 177 28 Q250 22 285 83 Q237 101 177 103 Q115 110 77 98Z" fill="url(#hatShade)" stroke="#1b1515" stroke-width="7"/>
          <path d="M43 111 Q104 80 183 86 Q259 87 309 109 Q287 131 210 126 Q110 132 43 111Z" fill="#30201e" stroke="#171314" stroke-width="7"/>
          <path d="M91 88 Q177 105 274 91" fill="none" stroke="#d59a32" stroke-width="10"/>
          <!-- hat glint -->
          <path d="M102 48 Q137 28 172 33" fill="none" stroke="#927067" stroke-width="5" opacity=".7" stroke-linecap="round"/>
        </svg>
        <div class="impact">HEY!</div>
        <div class="caption-wrap"><div class="caption" id="caption">HEY, PARTNER!</div><div class="caption-sub" id="captionSub">A WESTERN STORY</div></div>
        <div class="light-leak"></div>
        <div class="vignette"></div>
      </div>
      <div class="grain"></div>
      <div class="letterbox top"></div><div class="letterbox bottom"></div>
    </section>

    <footer class="controls">
      <div class="status"><span class="live-dot"></span><span id="status">SCENE PLAYING</span></div>
      <div class="buttons">
        <button id="replay">↻ Replay scene</button>
        <button id="pause">Ⅱ Pause</button>
      </div>
      <div class="hint">TIP: Resize the browser for a different cinematic framing</div>
    </footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
